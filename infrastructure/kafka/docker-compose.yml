name: airforce-stream

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: airforce-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: airforce-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_SOCKET_REQUEST_MAX_BYTES: "104857600"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: airforce-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "INFO"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: airforce-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "airforce-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      DYNAMIC_CONFIG_ENABLED: "true"

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: airforce-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic airforce.truth.raw.v1 --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic airforce.truth.validated.v1 --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic airforce.truth.dlq.v1 --partitions 3 --replication-factor 1
      "

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: airforce-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native TCP
    environment:
      CLICKHOUSE_DB: airforce
      CLICKHOUSE_USER: airforce
      CLICKHOUSE_PASSWORD: airforce_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ../clickhouse/data:/var/lib/clickhouse
      - ../clickhouse/logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user airforce --password airforce_pass --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # -- one shot service for inintializing clickhouse schema, will run once after clickhouse is up and then exit
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: airforce-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      until clickhouse-client --host clickhouse --user airforce --password airforce_pass --query 'SELECT 1'; do
        sleep 2;
      done &&
      for file in /migrations/*.sql; do
        echo \"applying migration: $$file\";
        clickhouse-client --host clickhouse --user airforce --password airforce_pass --multiquery < \"$$file\";
      done
      "
    volumes:
      - ../../migrations/clickhouse:/migrations:ro
    restart: "no"

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: airforce-grafana
    depends_on:
      clickhouse:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - ../grafana/data:/var/lib/grafana

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
